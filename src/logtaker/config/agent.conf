<agent_config>

    <logtaker>
        <default_logtaker_port>8443</default_logtaker_port>
        <host>0.0.0.0</host>
        <internal_queue_size>10000</internal_queue_size>
        <max_request_bytes>67108864</max_request_bytes>
        <server_cert>src/logtaker/config/certs/server.crt</server_cert>
        <server_key>src/logtaker/config/certs/server.key</server_key>
        <ca_cert>src/logtaker/config/certs/ca.crt</ca_cert>
        <require_client_cert>true</require_client_cert>
    </logtaker>

</agent_config>
