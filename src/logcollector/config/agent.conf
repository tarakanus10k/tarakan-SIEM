<agent_config>

    <agent>
        <default_log_conf>src/logcollector/config/conf.d</default_log_conf>
        <default_retry_interval>30.0</default_retry_interval>
        <default_scan_interval>60.0</default_scan_interval>
    </agent>

    <logcollector>
        <default_state_dir>/var/tsec/queue/logcollector</default_state_dir>
        <default_state_flush_interval>5.0</default_state_flush_interval>
        <default_selector_timeout>1.0</default_selector_timeout>
        <queue_max_items>100_000</queue_max_items>
        <queue_max_bytes>1024 * 1024 * 1024</queue_max_bytes>
    </logcollector>

</agent_config>