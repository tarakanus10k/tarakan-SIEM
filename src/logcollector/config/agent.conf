<agent_config>

    <agent>
        <default_log_conf>src/logcollector/config/conf.d</default_log_conf>
        <default_retry_interval>30.0</default_retry_interval>
        <default_scan_interval>60.0</default_scan_interval>
    </agent>

    <logcollector>
        <default_state_dir>/var/tsec/queue/logcollector</default_state_dir>
        <default_queue_dir>/var/tsec/queue/logcollector/outbox</default_queue_dir>
        <default_state_flush_interval>5.0</default_state_flush_interval>
        <default_selector_timeout>1.0</default_selector_timeout>
        <queue_max_items>100_000</queue_max_items>
        <queue_max_bytes>1024 * 1024 * 1024</queue_max_bytes>
        <default_ack_file>pending_acks.json</default_ack_file>
    </logcollector>

    <logsender>
        <default_sender_spool_dir>/var/tsec/queue/logsender</default_sender_spool_dir>
        <default_backoff_base>1.0</default_backoff_base>
        <default_backoff_max>300.0</default_backoff_max>
        <default_backoff_factor>2.0</default_backoff_factor>

        <target_url>https://localhost:8443/ingest</target_url>
        <batch_size>100</batch_size>
        <batch_timeout>5.0</batch_timeout>
        <max_retries>0</max_retries>
        <http_timeout>30.0</http_timeout>
    </logsender>

</agent_config>